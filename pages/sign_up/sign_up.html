<!-- sign_up.html -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../global/navFooter.css">
    <link rel="stylesheet" href="./sign_up.css">
</head>

<body>
    <header id="header" class="py-0"></header>
    <div class="container-lg d-flex flex-column justify-content-center" style="min-height: 88vh">
        <div class="row" id="container-form" style="border:1px solid;">
            <div class="col-12 col-xl-6 mb-2">
                <form class="needs-validation pt-3 pb-3 container-fluid border rounded-2 forms-sing-up bg-light" id="form-1">
                    <fieldset id="fieldset-form-1">
                        <div class="mb-2">
                            <label for="name" class="form-label">Nome</label>
                            <input type="text" class="form-control forms-inputs" id="name" placeholder="Seu nome completo" required>
                        </div>
                        <div class="mb-2">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control forms-inputs" id="cpf" maxlength="14" placeholder="123.456.789-00" required>
                        </div>
                        <div class="mb-2">
                            <label for="birth-date" class="form-label">Data de Nascimento</label>
                            <input type="text" class="form-control forms-inputs" id="birth-date" maxlength="10" placeholder="DD/MM/AAAA" required>
                        </div>
                        <div class="mb-2">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control forms-inputs" id="email" placeholder="seuemail@dominio.com" required>
                        </div>
                        <div class="mb-2">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control forms-inputs" id="password" placeholder="8 a 16 caracteres" required>
                            <div id="password-helper" class="form-text">
                                <p id="password-helper-text">Deve conter entre 8 a 16 caracteres</p>
                            </div>
                        </div>
                        <div class="mb-1">
                            <label for="password2" class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-control forms-inputs" id="password2" placeholder="Repita a senha" required>
                            <div id="password-helper2" class="form-text">Deve ser igual a anterior</div>
                        </div>
                        <div class="container-fluid px-0 mx-0 d-flex flex-row justify-content-end" id="btns-form-1">
                            <button type="reset" class="btn text-light bg-danger border-danger me-2 btns-sing-up">Limpar</button>
                            <button type="submit" class="btn text-light bg-dark border-dark btns-sing-up">Próximo</button>
                        </div>
                    </fieldset>
                </form>
            </div>

            <div class="col-12 col-xl-6">
                <form class="needs-validation pt-3 pb-3 container-fluid border rounded-2 forms-sing-up " id="form-2">
                    <fieldset id="fieldset-form-2" disabled>
                        <div class="mb-2">
                            <label for="form2File" class="form-label">Imagem do Perfil</label>
                            <input class="form-control" type="file" id="form2File">
                        </div>
                        <div class="mb-2">
                            <label for="cep" class="form-label">CEP</label>
                            <input type="text" class="form-control forms-inputs" id="cep" maxlength="9" placeholder="12345-678">
                            <div id="cep-helper" class="form-text">
                                <p id="cep-helper-text">Em caso de não haver CEP, deixar em branco</p>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="container col-12 col-md-10">
                                <label for="logradouro" class="form-label ">Logradouro</label>
                                <input type="text" class="form-control forms-inputs" id="logradouro" required>
                            </div>
                            <div class="container col-12 col-md-2 ">
                                <label for="number" class="form-label mx-0 py-0">Número</label>
                                <input type="text" class="form-control forms-inputs ms-0" id="number" maxlength="9">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label for="neighborhood" class="form-label">Bairro</label>
                            <input type="text" class="form-control forms-inputs" id="neighborhood" required>
                        </div>
                        <div class="mb-2">
                            <div class="row">
                                <div class="container mx-0 py-0 col-9 col-md-10">
                                    <label for="city" class="form-label">Cidade</label>
                                    <input type="text" class="form-control forms-inputs" id="city" required>
                                </div>
                                <div class="container col-3 col-md-2">
                                    <label for="uf" class="form-label">UF</label>
                                    <input type="text" class="form-control forms-inputs" id="uf" maxlength="2" required>
                                </div>
                            </div>
                        </div>
                        <div id="div-complement">
                            <label for="complement" class="form-label">Complemento</label>
                            <input type="text" class="form-control forms-inputs" id="complement" maxlength="40">
                        </div>
                        <div class="d-flex flex-row justify-content-between" id="btns-form-2">
                            <button type="button" class="btn text-light bg-dark border-dark me-2 btns-sing-up" id="back-button">Voltar</button>
                            <div class="px-0 mx-0 ">
                                <button type="reset" class="btn text-light bg-danger border-danger me-0 btns-sing-up">Limpar</button>
                                <button type="submit" class="btn text-light bg-success border-success btns-sing-up">Cadastrar</button>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
    <footer id="footer" class="footer bg-info text-center"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../global/global.js" defer></script>
    <script src="./sign_up.js" defer></script>
</body>

</html>
