<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../global/navFooter.css">
</head>

<body>
    <header id="header" class="py-0"></header>
    <main class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center">Dashboard</h1>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pacotes de Viagem</h5>
                        <canvas id="chartViagem"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pacotes de Cruzeiro</h5>
                        <canvas id="chartCruzeiro"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4" id="admin-menu" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Gerenciar Pacotes</h5>
                        <button id="adicionarPacoteBtn" class="btn btn-primary">Adicionar Pacote</button>
                        <button id="editarPacoteBtn" class="btn btn-secondary">Editar Pacote</button>
                        <button id="removerPacoteBtn" class="btn btn-danger">Remover Pacote</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer" class="footer bg-info text-center"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../global/global.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../global/pacotes.js"></script>
    <script src="./dashboard.js"></script>
</body>

</html>
